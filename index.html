<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Soumission gratuite | LL MEDIA Template</title><meta name="description" content="Landing page de génération de leads optimisée pour les campagnes LL MEDIA."><style>body{font-family:Arial,sans-serif;margin:0;background:#f6f7f9;color:#111}.wrap{max-width:760px;margin:auto;padding:32px 18px}.card{background:#fff;border-radius:18px;padding:28px;box-shadow:0 12px 35px rgba(0,0,0,.08)}h1{font-size:clamp(34px,7vw,58px);line-height:1;margin:0 0 14px}.sub{font-size:20px;color:#444}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}input,select,button{width:100%;box-sizing:border-box;padding:15px;border-radius:10px;border:1px solid #d8d8d8;font-size:16px}button{background:#111;color:#fff;border:0;font-weight:700;cursor:pointer}.msg{margin-top:12px;font-size:14px}.hp{position:absolute;left:-9999px}@media(max-width:620px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><section class="card"><p><strong>LL MEDIA</strong></p><h1>Obtenez votre soumission gratuite</h1><p class="sub">Remplissez le formulaire. Une personne de notre équipe vous recontactera rapidement.</p><form id="leadForm"><div class="grid"><input name="name" placeholder="Nom complet" required><input name="phone" type="tel" placeholder="Téléphone" required><input name="email" type="email" placeholder="Courriel"><input name="city" placeholder="Ville"><select class="full" name="project"><option value="">Type de projet</option><option>Isolation</option><option>Toiture</option><option>Thermopompe</option><option>Rénovation</option><option>Autre</option></select><input class="hp" name="website" tabindex="-1" autocomplete="off"><button class="full" type="submit">OBTENIR MA SOUMISSION</button></div><div id="msg" class="msg"></div></form></section></main><script>const form=document.getElementById('leadForm'),msg=document.getElementById('msg');form.addEventListener('submit',async e=>{e.preventDefault();msg.textContent='Envoi en cours…';const data=Object.fromEntries(new FormData(form).entries());try{const r=await fetch('/api/lead',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...data,page:location.href,submitted_at:new Date().toISOString()})});if(!r.ok)throw new Error();location.href='/merci.html'}catch(err){msg.textContent="La transmission n'a pas fonctionné. Réessayez dans un instant."}});</script></body></html>
